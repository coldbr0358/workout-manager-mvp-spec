name = "workout-manager-ai"
main = "src/index.ts"
compatibility_date = "2026-08-27"

[vars]
OPENAI_MODEL = "gpt-5.4-mini"
MONTHLY_REQUEST_LIMIT = "120"
MONTHLY_TOKEN_BUDGET = "600000"

# 배포 전 Cloudflare Secrets로 설정:
# OPENAI_API_KEY
# SUPABASE_URL
# SUPABASE_ANON_KEY
# SUPABASE_SERVICE_ROLE_KEY
# ALLOWED_ORIGIN
